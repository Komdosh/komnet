version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain rather than four: these move together and are
      # verified by the same gate.
      dev-toolchain:
        patterns: ["typescript", "prettier", "oxlint", "esbuild", "@types/node"]
    ignore:
      # Pinned deliberately: the SEA build targets a specific Node major, and
      # bumping it means rebuilding and re-releasing every platform artifact.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
