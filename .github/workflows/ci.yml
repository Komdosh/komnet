name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately: the test suite drives real git, and git behaviour
        # plus filesystem case-sensitivity differ between Linux and macOS —
        # exactly the difference room-id validation exists to protect against.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Check git version
        # `worktree add --orphan` (2.42+) is required to create a room branch in
        # a repository with no commits.
        run: |
          git --version
          git worktree add --help >/dev/null

      - run: pnpm install --frozen-lockfile

      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: shellcheck -s sh install.sh

  binary:
    name: single-executable smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Catch a broken SEA build on every push rather than at release time,
      # when it is far more disruptive.
      - run: node scripts/build-binary.mjs
      - name: The binary must run with no Node on PATH
        run: env -i HOME="$HOME" PATH=/usr/bin:/bin ./dist-bin/komnet --version
