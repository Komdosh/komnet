name: Release

# Cutting a release:
#   1. bump the version (package.json + VERSION in packages/cli/src/main.ts)
#   2. update CHANGELOG.md
#   3. git tag v0.1.0 && git push origin v0.1.0
#
# This builds one self-contained binary per platform, publishes them with
# checksums, and — importantly — uploads install.sh as a release asset so that
#   https://github.com/<repo>/releases/latest/download/install.sh
# is always the installer matching the newest release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string
  # Called by autorelease.yml. Invoking it directly avoids needing a PAT: a tag
  # pushed with GITHUB_TOKEN does NOT trigger workflows, so a tag-triggered
  # release would silently never run.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write
  # Required for npm provenance: npm exchanges this for a signed attestation
  # tying each published tarball to this workflow run and commit.
  id-token: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    name: version guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: check
        name: Every version site must agree with the tag
        # A binary that reports a different version from its tag is worse than
        # no binary: every later bug report cites a version that never existed.
        # `--verify` checks all seven sites, including MCP_SERVER_VERSION, which
        # an earlier hand-written guard here silently missed.
        run: |
          set -eu
          version="${TAG#v}"
          node scripts/release-version.mjs --verify "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # SEA cannot cross-compile — each platform is built on its own runner.
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14, target: darwin-arm64 }
          # Intel macOS lives on `macos-15-intel`: GitHub retired `macos-13`, and
          # a job asking for a retired label does not fail — it queues forever
          # with no runner assigned, so the release simply never finishes.
          - { os: macos-15-intel, target: darwin-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-binary.mjs

      - name: Smoke test the binary in a clean environment
        # Proves the runtime really is embedded — this is the property the
        # whole 100+ MB is bought for (ADR 0011).
        run: |
          set -eu
          env -i HOME="$HOME" PATH=/usr/bin:/bin ./dist-bin/komnet --version
          env -i HOME="$HOME" PATH=/usr/bin:/bin ./dist-bin/komnet --help >/dev/null

      - name: Package
        run: |
          set -eu
          name="komnet-v${{ needs.guard.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C dist-bin komnet
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # Tags and history, so the notes step can name the previous release.
          # The default shallow clone has neither, and the compare link would
          # vanish silently rather than fail.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          cd artifacts
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Verify install.sh can resolve every asset it names
        # The installer derives the archive name from the version and target.
        # If that formula drifts from what we actually publish, installs 404 —
        # so assert the agreement here rather than discovering it from users.
        run: |
          set -eu
          version="${{ needs.guard.outputs.version }}"
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            expected="komnet-v$version-$target.tar.gz"
            grep -q " $expected\$" artifacts/SHA256SUMS \
              || { echo "::error::$expected missing from SHA256SUMS"; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The release page shows what a person wrote, not a compare link.
          # `--generate-notes` builds its output from merged pull requests, and
          # work lands here by push — so it produced one line while the prose
          # written for exactly this purpose sat unread in CHANGELOG.md.
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-version.mjs --notes "${TAG#v}" > "$notes"

          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n\n**Full changelog**: %s/compare/%s...%s\n' \
              "${{ github.server_url }}/${{ github.repository }}" "$previous" "$TAG" >> "$notes"
          fi

          # An empty section means nobody wrote notes for this version. Falling
          # back beats publishing a blank release page.
          if [ -s "$notes" ]; then
            notes_arg="--notes-file=$notes"
          else
            echo "::warning::no CHANGELOG section for ${TAG#v} — falling back to generated notes"
            notes_arg="--generate-notes"
          fi

          # install.sh ships as a release asset so that
          # releases/latest/download/install.sh always matches the newest
          # release, and `curl | bash` never fetches an installer from a branch
          # that may be ahead of what is published.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "komnet $TAG" \
            "$notes_arg" \
            --verify-tag \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS \
            install.sh

      - name: Verify the published installer round-trips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          url="https://github.com/${{ github.repository }}/releases/latest/download/install.sh"
          # The Authorization header is load-bearing on a private repository:
          # releases/latest/download/ answers 404 to an unauthenticated request,
          # so a bare `curl` fails here no matter what GH_TOKEN is set to — that
          # variable is read by the `gh` CLI, never by curl. curl then drops the
          # header on the cross-host redirect to the signed asset URL, which is
          # correct: that URL carries its own credentials.
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o /tmp/install.sh
          diff -q /tmp/install.sh install.sh
          echo "✓ $url serves this release's installer"

  npm:
    name: publish to npm
    needs: [guard, build]
    runs-on: ubuntu-latest
    # NPM_TOKEN lives on this environment, not as a repository secret. Without
    # this line `secrets.NPM_TOKEN` resolves to an empty string and the publish
    # step below skips silently while the job still reports success — a no-op
    # that looks exactly like a successful release.
    environment: publishing
    # Skipped on forks, where the secret is unavailable by design.
    if: ${{ github.repository == 'Komdosh/komnet' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set — skipping npm publish"
            exit 0
          fi

          # Order matters: a package cannot resolve on the registry until every
          # package it depends on is already there.
          for pkg in protocol core daemon mcp cli; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "→ $name@$version already published, skipping"
              continue
            fi

            # pnpm packs (it rewrites workspace:* to real versions, which npm
            # cannot do); npm publishes the tarball (it can attach provenance).
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            echo "→ publishing $name@$version from $tarball"
            npm publish "$tarball" --provenance --access public
          done

      - name: Verify the CLI installs from the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          [ -n "${NODE_AUTH_TOKEN:-}" ] || exit 0
          version="${{ needs.guard.outputs.version }}"

          # Retry the INSTALL, not a lookup of one package.
          #
          # Propagation is per-package and wildly uneven: on 0.1.4 the unscoped
          # `komnet` became readable within seconds while its four @komnet/*
          # dependencies took about five minutes. Probing only `komnet` therefore
          # reported ready almost immediately and the install then 404'd on a
          # dependency the probe had never looked at — a red release for a
          # publish that was entirely correct.
          #
          # Installing is also precisely what a user does, so unlike a metadata
          # lookup it cannot pass while the published set is unusable.
          log="$RUNNER_TEMP/verify-install.log"
          deadline=$((SECONDS + 600))
          attempt=0
          until npm i -g "komnet@$version" >"$log" 2>&1; do
            attempt=$((attempt + 1))
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::komnet@$version was published but is not installable after 10 minutes"
              tail -30 "$log"
              exit 1
            fi
            echo "not installable yet (attempt $attempt, $((deadline - SECONDS))s left) — retrying in 15s"
            sleep 15
          done

          test "$(komnet --version)" = "$version"
          echo "✓ npm i -g komnet@$version works"

  registry:
    name: publish to the MCP registry
    # AFTER npm, not beside it: the registry proves ownership by reading
    # `mcpName` out of the published package, so the version has to exist on npm
    # first. Depending on the npm job inherits its installability wait, which is
    # a stronger guarantee than the metadata merely being visible.
    needs: [guard, npm]
    runs-on: ubuntu-latest
    # A fork would authenticate as its own owner and fail on the namespace.
    if: ${{ github.repository == 'Komdosh/komnet' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install mcp-publisher
        # Pinned like every other tool here: `latest` would change the publish
        # contract under a release with no commit to point at.
        env:
          PUBLISHER_VERSION: v1.8.1
        run: |
          set -eu
          url="https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --help >/dev/null

      - name: Publish server.json
        run: |
          set -eu
          version="${{ needs.guard.outputs.version }}"
          name=$(node -p "require('./server.json').name")

          # The version guard already proved server.json agrees with the tag, so
          # the only open question is whether the registry has it. Re-publishing
          # an existing version is an error there, and re-running a green release
          # is an ordinary thing to do.
          published=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=komnet" \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => (raw += chunk));
              process.stdin.on("end", () => {
                const wanted = process.argv[1];
                const versions = (JSON.parse(raw).servers ?? [])
                  .map((entry) => entry.server ?? entry)
                  .filter((server) => server.name === wanted)
                  .map((server) => server.version);
                process.stdout.write(versions.join(" "));
              });
            ' "$name")

          case " $published " in
            *" $version "*)
              echo "→ $name $version is already in the registry, skipping"
              exit 0 ;;
          esac

          # Exchanges this run's OIDC token for a registry JWT. The namespace is
          # derived from the repository owner, which is why forks are skipped
          # above and why this needs no secret.
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

      - name: The registry must serve this version
        # Verified, not assumed: `publish` reporting success and the registry
        # actually serving the version are two different claims.
        #
        # POLLED, because the registry's search index is eventually consistent
        # and the write is not. 0.8.2 was stored at :59.131 and this step failed
        # at :59.313 — 180ms later, for a version that had already published
        # successfully. A single immediate query turns a green release red on
        # timing alone, and 0.8.0 and 0.8.1 passed it by luck rather than by
        # being any more correct.
        run: |
          set -eu
          version="${{ needs.guard.outputs.version }}"
          name=$(node -p "require('./server.json').name")
          serves() {
            curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=komnet" \
              | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => (raw += chunk));
                process.stdin.on("end", () => {
                  const [wanted, version] = process.argv.slice(1);
                  const hit = (JSON.parse(raw).servers ?? [])
                    .map((entry) => entry.server ?? entry)
                    .find((server) => server.name === wanted && server.version === version);
                  process.exit(hit ? 0 : 1);
                });
              ' "$name" "$version"
          }
          for attempt in 1 2 3 4 5 6; do
            if serves; then
              echo "✓ the registry serves $name $version"
              exit 0
            fi
            echo "not visible yet (attempt $attempt/6) — the search index lags the write"
            sleep 5
          done
          echo "::error::$name $version never appeared in the registry after 30s"
          exit 1
